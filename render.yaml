services:
  - type: web
    name: samira-collection-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: STRICT_PRODUCTION_CONFIG
        value: "true"
      - key: ENABLE_REEL_PRODUCT_IMPORT
        value: "true"
      - key: REQUIRE_DATABASE
        value: "true"
      - key: REQUIRE_MEDIA_STORAGE
        value: "true"
      - key: MONGO_URI
        sync: false
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: ALLOW_REFRESH_TOKEN_BODY
        value: "false"
      - key: RETURN_REFRESH_TOKEN_IN_BODY
        value: "false"
      - key: AUTH_COOKIE_SAME_SITE
        value: none
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: PUBLIC_API_URL
        value: https://samira-collection-backend-1.onrender.com
      - key: CLIENT_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ADMIN_PHONE_NUMBERS
        sync: false
      # Temporary team-demo login. Disable the owner switch before live use.
      - key: OTP_MODE
        value: demo
      - key: DEMO_OTP
        value: "123456"
      - key: ALLOW_HOSTED_OWNER_DEMO
        value: "true"
      - key: OTP_EXPIRY_MINUTES
        value: "5"
      - key: OTP_MAX_ATTEMPTS
        value: "5"
      - key: OTP_RESEND_COOLDOWN_SECONDS
        value: "60"
      - key: SMS_PROVIDER
        sync: false
      # Choose twilio, msg91, 2factor or fast2sms. Add ONLY that provider's
      # credentials in the backend Environment tab; see docs/otp-providers.md.
      # Existing SMS_ACCOUNT_SID / SMS_AUTH_TOKEN / SMS_SENDER_ID remain supported.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      - key: R2_FOLDER
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: samira-products
